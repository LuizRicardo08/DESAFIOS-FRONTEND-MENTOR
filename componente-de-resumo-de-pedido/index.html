<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo do Pedido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="foto"></div>

        <h1>Resumo do Pedido</h1>
        <p>Agora você pode ouvir milhões de músicas, audiolivros e podcasts em qualquer dispositivo, onde quiser!</p>

        <div class="plano">
            <img src="images/icon-music.svg" alt="">

            <div class="conteudo-plano">
                <p class="titulo">Plano Anual</p>
                <p>US$ 59,99/ano</p>
            </div>

            <a href="#">Alterar</a>
        </div>

        <div class="botoes">
            <button class="prosseguir">Prosseguir para o pagamento</button>
            <button class="cancelar">Cancelar pedido</button>
        </div>
    </main>
</body>
</html>
