<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo de Resultado</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-query.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <main>
        <div class="seu-resultado">
            <div class="conteudo-resultado">
                <p class="titulo">Seu resultado</p>
                <div class="circulo">
                    <div class="conteudo-circulo">
                        <p class="pontos">76</p>
                        <p class="qtd-tot">de 100</p>
                    </div>
                </div>
                <p class="qualidade">Ótimo</p>
                <p class="texto">Você obteve uma pontuação superior à de 65% das pessoas que fizeram estes testes.</p>
            </div>
        </div>
        
        <div class="conteudo-main">
            <h1>Resumo</h1>
            <div class="skils reacao">
                <p><i class="bi bi-lightning-charge"></i>Reação</p>
                <p class="pts"><span>80</span> / 100</p>
            </div>
            
            <div class="skils memoria">
                <p><i class="bi bi-activity"></i>Memória</p>
                <p class="pts"><span>92</span> / 100</p>
            </div>
            <div class="skils verbal">
                <p><i class="bi bi-chat"></i>Verbal</p>
                <p class="pts"><span>61</span> / 100</p>
            </div>
            <div class="skils visual">
                <p><i class="bi bi-eye"></i>Visual</p>
                <p class="pts"><span>72</span> / 100</p>
            </div>

            <a href="#">Continuar</a>
        </div>
    </main>
</body>
</html>
